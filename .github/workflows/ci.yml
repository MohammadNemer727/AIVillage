name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Workspace quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Committed GPU shader matches kernel sources
        run: sh crates/sim-shaders/build-shaders.sh --check
      - name: Committed Luanti palette matches source colours
        run: python3 integrations/luanti/tools/generate_palette.py --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Rustdoc
        run: cargo doc --workspace --all-features --no-deps

  luanti-smoke:
    name: Headless Luanti bridge smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Build pinned Luanti server image
        run: docker build -t ai-village-luanti integrations/luanti
      - name: Smoke the bridge against the pinned server and replay its trace
        env:
          LUANTI_SERVER_IMAGE: ai-village-luanti
        run: sh integrations/luanti/ci/headless-smoke.sh "$RUNNER_TEMP/luanti-smoke"

  luanti-body:
    name: Founder player body (VoxeLibre)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Build the pinned body-test image
        run: >
          docker build -f integrations/luanti/ci/Dockerfile.body-test
          -t ai-village-body-test integrations/luanti/ci
      - name: Drive the founder's body through every ability
        timeout-minutes: 12
        env:
          BODY_TEST_IMAGE: ai-village-body-test
        run: sh integrations/luanti/ci/body-test.sh "$RUNNER_TEMP/body-test"
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: body-test-logs
          path: |
            ${{ runner.temp }}/body-test/*.log
            ${{ runner.temp }}/body-test/bridge.ndjson
            ${{ runner.temp }}/body-test/minetest.conf
          if-no-files-found: ignore
