[package]
name = "sim-cli"
description = "Headless command boundary for AI Village experiments and replay verification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
sim-core = { path = "../sim-core" }
sim-format = { path = "../sim-format" }
sim-gpu = { path = "../sim-gpu", optional = true }
toml = { workspace = true }

[features]
# Adds the `gpu-verify` command, which runs V2 brains on a Vulkan GPU via sim-gpu.
gpu = ["dep:sim-gpu"]
