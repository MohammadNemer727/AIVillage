[package]
name = "sim-cli"
description = "Headless command boundary for AI Village experiments and replay verification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
sim-core = { path = "../sim-core" }
sim-format = { path = "../sim-format" }
sim-gpu = { path = "../sim-gpu", optional = true }
toml = { workspace = true }

[features]
default = ["gpu"]
# Lets V2 brains run on a Vulkan GPU via sim-gpu (`--backend`) and enables `gpu-verify`.
gpu = ["dep:sim-gpu"]
