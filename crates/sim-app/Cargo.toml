[package]
name = "sim-app"
description = "Bevy desktop shell for visualizing AI Village experiments."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bevy.workspace = true
sim-core = { path = "../sim-core" }
sim-format = { path = "../sim-format" }
sim-gpu = { path = "../sim-gpu", optional = true }

[features]
default = ["gpu"]
# Lets V2 brains run on a Vulkan GPU when one is present and faster; see `AI_VILLAGE_BACKEND`.
gpu = ["dep:sim-gpu"]
